<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — BDOS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700&family=Anek+Latin:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{color-scheme:dark; --delta:#00E37A; --sonar:#FFC24B; --kalo:#07090A; --text:#EDF2EE; --dim:#93A49C}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; background:var(--kalo); color:var(--text);
  font-family:"Anek Latin","Anek Bangla","Noto Sans Bengali",system-ui,sans-serif;
  display:flex; align-items:center; padding:40px 28px; -webkit-font-smoothing:antialiased}
.wrap{max-width:560px; margin:0 auto}
.mark{position:relative; display:inline-block; padding-top:.2em; line-height:.9; margin-bottom:26px}
.mark .bar{position:absolute; top:0; left:0; right:0; height:.085em; border-radius:99px;
  background:linear-gradient(90deg,var(--delta),var(--sonar))}
.mark .l{font-size:clamp(44px,9vw,68px); font-weight:800; font-stretch:88%; letter-spacing:-.035em; display:block}
h1{font-size:clamp(24px,4.4vw,34px); font-weight:800; letter-spacing:-.02em; line-height:1.15; margin:0 0 12px}
p{color:var(--dim); font-size:17px; line-height:1.6; margin:0 0 26px}
.bn{font-family:"Anek Bangla","Noto Sans Bengali",sans-serif; font-weight:600; color:var(--text)}
a.home{display:inline-block; background:var(--delta); color:#04120A; text-decoration:none;
  font-weight:700; font-size:16px; padding:13px 22px; border-radius:8px}
a.home:hover{background:#22EA8D}
code{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:13px; color:var(--sonar)}
:focus-visible{outline:2px solid var(--delta); outline-offset:3px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span class="bar"></span><span class="l">404</span></div>
    <h1>This page isn't here.</h1>
    <p><span class="bn">এই পাতাটি নেই।</span> The link may be old, or the page may not be
      built yet — most of BDOS isn't public.</p>
    <a class="home" href="/">Back to bdos.io</a>
  </div>
</body>
</html>
